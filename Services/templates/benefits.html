{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold mb-0">Incentivos Institucionales</h3>
        <p class="text-muted mb-0">Canjea tus horas acumuladas por beneficios universitarios</p>
    </div>
    <span class="badge bg-primary fs-6 px-3 py-2">Acumulado: 32 hrs</span>
</div>

<div class="row g-4">
    {% for ben in benefits %}
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 h-100 card-hover">
            <div class="card-body d-flex align-items-start gap-3">
                <div class="bg-primary-subtle text-primary p-3 rounded-3 fs-3">
                    <i class="bi {{ ben.icono }}"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between">
                        <h5 class="fw-bold mb-1">{{ ben.nombre }}</h5>
                        <span class="badge bg-dark align-self-start">{{ ben.horas }} hrs</span>
                    </div>
                    <p class="text-muted small mb-3">{{ ben.descripcion }}</p>
                    <button class="btn btn-sm btn-outline-primary">Solicitar Redención</button>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
