{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold mb-1">Welcome Back</h3>
                <p class="text-muted small">Sign in to post offers and request skill exchanges</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control" required autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control" required>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger small py-2">
                        Invalid username or password. Please try again.
                    </div>
                {% endif %}

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Log In</button>
            </form>

            <p class="text-center small text-muted mt-4 mb-0">
                Don't have an account? <a href="{% url 'register' %}" class="fw-semibold text-decoration-none">Create one here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
